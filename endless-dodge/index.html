<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Endless Dodge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0b0d12;
    color: #e8ecf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: linear-gradient(180deg, #0e1320 0%, #161b2d 100%);
    box-shadow: 0 0 40px rgba(80,120,255,0.15);
    border-radius: 8px;
    touch-action: none;
  }
  #hud {
    position: fixed; top: 12px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  #score { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
  #best { font-size: 13px; opacity: 0.6; margin-top: 2px; }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8,10,16,0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    text-align: center; padding: 20px;
    transition: opacity 0.2s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { font-size: 36px; margin-bottom: 8px; letter-spacing: 1px; }
  #overlay p { opacity: 0.75; margin-bottom: 18px; font-size: 14px; line-height: 1.5; }
  #overlay .final { font-size: 22px; margin: 6px 0 16px; }
  button {
    background: #4a7dff; color: white; border: none;
    padding: 12px 28px; border-radius: 6px; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  button:hover, button:active { background: #5e8dff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<div id="hud">
  <div id="score">0</div>
  <div id="best">Best: 0</div>
</div>
<div id="overlay">
  <h1>Endless Dodge</h1>
  <p>Steer left and right to dodge the obstacles.<br>
     <b>Drag</b> (mouse or finger) &nbsp;·&nbsp; or <b>A/D</b> / <b>← →</b></p>
  <div class="final" id="finalScore" style="display:none;"></div>
  <button id="startBtn">Play</button>
</div>
<script src="game.js"></script>
</body>
</html>
